services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run python3 main.py"

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: minime
      POSTGRES_USER: minime
      POSTGRES_PASSWORD: minime
    ports:
      - "5432:5432"
    volumes:
      - minime-postgres:/var/lib/postgresql/data

volumes:
  minime-postgres:

